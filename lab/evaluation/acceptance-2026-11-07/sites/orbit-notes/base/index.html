<!doctype html>
<html lang="en">
	<meta charset="utf-8" /><title>Orbit Notes</title
	><style>
		body {
			font: 18px sans-serif;
			max-width: 850px;
			margin: 30px auto;
		}
		article {
			padding: 20px;
			background: #eef3fa;
		}
		aside {
			background: #f8eee0;
			padding: 20px;
		}
		svg {
			display: block;
			width: 260px;
			height: 140px;
		}
	</style>
	<header><h1>Orbit Notes</h1></header>
	<main>
		<article aria-label="Nebula field note">
			<h2>Nebula Field Guide</h2>
			<svg role="img" aria-label="Orbit diagram" viewBox="0 0 260 140">
				<rect width="260" height="140" fill="#15263e" />
				<ellipse
					cx="130"
					cy="70"
					rx="100"
					ry="44"
					fill="none"
					stroke="#9ed8ee"
					stroke-width="3"
				/>
				<circle cx="130" cy="70" r="14" fill="#ffd66e" />
			</svg>
			<p>
				Observation window: 18:40–19:10 UTC. This is the complete field note.
			</p>
		</article>
		<aside aria-label="Other observations">
			<h2>Recommended observations</h2>
			<p>A separate catalogue. Do not confuse it with the field note.</p>
		</aside>
	</main>
</html>
