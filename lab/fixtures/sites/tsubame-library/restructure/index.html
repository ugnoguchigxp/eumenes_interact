<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>つばめ図書館</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">つばめ図書館</a>
			<nav><a href="guide.html" target="_blank">ご利用案内</a></nav>
		</header>
		<main>
			<h1>蔵書検索</h1>
			<form action="results.html" method="get" role="search">
				<label for="q">キーワード</label>
				<input id="q" name="q" type="search" />
				<fieldset>
					<legend>館</legend>
					<label
						><input type="radio" name="branch" value="" checked /> すべて</label
					>
					<label
						><input type="radio" name="branch" value="central" /> 中央館</label
					>
					<label
						><input type="radio" name="branch" value="east" /> 東分館</label
					>
				</fieldset>
				<p><button type="submit">蔵書を検索</button></p>
			</form>
		</main>
	</body>
</html>
