<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>つばめ図書館</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">つばめ図書館</a>
			<nav><a href="guide.html" target="_blank">ご利用案内</a></nav>
		</header>
		<main>
			<h1>蔵書検索</h1>
			<form action="search.html" method="get" role="search">
				<label for="keyword">検索語</label>
				<input id="keyword" name="keyword" type="search" />
				<label for="library">所蔵</label>
				<select id="library" name="library">
					<option value="">すべての館</option>
					<option value="central">中央館</option>
					<option value="east">東分館</option>
				</select>
				<p><button type="submit">蔵書を検索</button></p>
			</form>
		</main>
	</body>
</html>
