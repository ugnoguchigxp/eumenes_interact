<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ホール見学予約 | みなと市民ホール</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">みなと市民ホール</a>
			<nav aria-label="メイン">
				<a href="index.html">ホーム</a>
				<a href="apply.html">見学予約</a>
				<a href="mail.html">メールマガジン</a>
			</nav>
		</header>
		<main>
			<h1>ホール見学予約</h1>
			<form action="done.html" method="get">
				<label for="fullname">ご氏名</label>
				<input id="fullname" name="fullname" required />
				<label for="email">連絡先メール</label>
				<input id="email" name="email" type="email" required />
				<label for="date">ご希望の日</label>
				<select id="date" name="date">
					<option value="">選択してください</option>
					<option value="2026-11-14">11月14日（土）</option>
					<option value="2026-11-21">11月21日（土）</option>
					<option value="2026-11-28">11月28日（土）</option>
				</select>
				<label for="people">参加人数</label>
				<select id="people" name="people">
					<option value="1">1名</option>
					<option value="2">2名</option>
					<option value="3">3名</option>
					<option value="4">4名</option>
					<option value="5">5名</option>
					<option value="6">6名</option>
				</select>
				<label for="note">ご要望</label>
				<textarea id="note" name="note" rows="3"></textarea>
				<p>
					<button type="submit">この内容で送信</button>
					<button type="reset">やり直す</button>
				</p>
			</form>
		</main>
	</body>
</html>
