<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ホール見学の申し込み | みなと市民ホール</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">みなと市民ホール</a>
			<nav aria-label="メイン">
				<a href="index.html">ホーム</a>
				<a href="apply.html">見学の申し込み</a>
				<a href="mail.html">メールマガジン</a>
			</nav>
		</header>
		<main>
			<h1>ホール見学の申し込み</h1>
			<form id="applyform" action="done.html" method="get">
				<fieldset>
					<legend>ご来場者</legend>
					<label
						>人数
						<select name="people">
							<option value="1">1名</option>
							<option value="2">2名</option>
							<option value="3">3名</option>
							<option value="4">4名</option>
							<option value="5">5名</option>
							<option value="6">6名</option>
						</select></label
					>
					<label>お名前 <input name="fullname" required /></label>
					<label
						>メールアドレス <input name="email" type="email" required
					/></label>
				</fieldset>
				<fieldset>
					<legend>ご希望</legend>
					<label
						>見学希望日
						<select name="date">
							<option value="">選択してください</option>
							<option value="2026-11-14">11月14日（土）</option>
							<option value="2026-11-21">11月21日（土）</option>
							<option value="2026-11-28">11月28日（土）</option>
						</select></label
					>
					<label>備考 <textarea name="note" rows="3"></textarea></label>
				</fieldset>
			</form>
		</main>
		<footer class="bar">
			<button type="reset" form="applyform">入力をクリア</button>
			<button type="submit" form="applyform">申し込む</button>
		</footer>
	</body>
</html>
