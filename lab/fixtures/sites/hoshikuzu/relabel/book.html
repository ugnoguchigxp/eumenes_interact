<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>書籍 | 星屑堂書店</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">星屑堂書店</a
			><span id="cart-count">カート: 0冊</span>
		</header>
		<main>
			<h1 id="title"></h1>
			<p id="meta"></p>

			<div class="actions" id="actions">
				<button type="button" id="stock-btn">在庫を調べる</button>
				<button type="button" id="cart-btn">買い物かごへ入れる</button>
			</div>
			<p id="stock" aria-live="polite"></p>
			<p id="cart-msg" aria-live="polite"></p>
			<p><a href="index.html">ホームへ戻る</a></p>
		</main>
		<script src="../shop.js"></script>
		<script>
			const b = getBook(new URLSearchParams(location.search).get("id"));
			const title = document.getElementById("title");
			if (!b) {
				title.textContent = "本が見つかりません";
				document.getElementById("actions").hidden = true;
			} else {
				title.textContent = b.title;
				document.title = b.title + " | 星屑堂書店";
				document.getElementById("meta").textContent =
					b.author + " / " + b.price + "円";
				document.getElementById("stock-btn").addEventListener("click", () => {
					document.getElementById("stock").textContent =
						b.stock > 0 ? "在庫: " + b.stock + "冊" : "在庫なし";
					location.hash = "stock";
				});
				document.getElementById("cart-btn").addEventListener("click", () => {
					document.getElementById("cart-msg").textContent =
						"カートに入れました";
					document.getElementById("cart-count").textContent = "カート: 1冊";
					location.hash = "cart";
				});
			}
		</script>
	</body>
</html>
