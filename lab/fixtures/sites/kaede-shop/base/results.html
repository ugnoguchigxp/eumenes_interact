<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>検索結果 | 楓雑貨店</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">楓雑貨店</a>
			<nav aria-label="メイン">
				<a href="index.html">ホーム</a>
				<a href="catalog.html">全商品</a>
				<a href="care.html">お手入れガイド</a>
				<a href="order.html">ご注文フォーム</a>
			</nav>
		</header>
		<main>
			<h1>検索結果</h1>
			<p id="summary" aria-live="polite"></p>
			<ul id="list"></ul>
		</main>
		<script src="../kaede.js"></script>
		<script>
			const q = new URLSearchParams(location.search).get("q") || "";
			const hits = findProducts(q);
			document.getElementById("summary").textContent = hits.length
				? "「" + q + "」: " + hits.length + "件"
				: "「" + q + "」に一致する商品はありません";
			document.getElementById("list").innerHTML = hits
				.map(
					(p) =>
						'<li><a href="product.html?id=' +
						p.id +
						'">' +
						p.name +
						"</a> <span>" +
						p.price +
						"円 / " +
						p.material +
						"</span></li>",
				)
				.join("");
		</script>
	</body>
</html>
