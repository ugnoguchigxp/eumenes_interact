<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>注文完了 | 楓雑貨店</title>
		<link rel="stylesheet" href="../site.css" />
	</head>
	<body>
		<header>
			<a href="index.html" class="brand">楓雑貨店</a>
			<nav aria-label="メイン">
				<a href="index.html">ホーム</a>
				<a href="catalog.html">全商品</a>
				<a href="care.html">お手入れガイド</a>
				<a href="order.html">ご注文フォーム</a>
			</nav>
		</header>
		<main>
			<h1>ご注文を受け付けました</h1>
			<dl id="detail"></dl>
			<p><a href="index.html">ホームへ戻る</a></p>
		</main>
		<script>
			const p = new URLSearchParams(location.search);
			const dl = document.getElementById("detail");
			for (const k of ["fullname", "email", "item", "gift", "delivery"]) {
				if (!p.has(k)) continue;
				const dt = document.createElement("dt");
				dt.textContent = k;
				const dd = document.createElement("dd");
				dd.textContent = p.get(k);
				dl.append(dt, dd);
			}
		</script>
	</body>
</html>
